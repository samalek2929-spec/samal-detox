name: Update prices
on:
  schedule:
    - cron: '5 4 * * *' # 09:05 Almaty (UTC+5); GitHub may delay scheduled runs by some minutes
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-prices.mjs
      - name: Commit if changed
        run: |
          [ -z "$(git status --porcelain prices.json)" ] && exit 0
          git config user.name "prices-bot"
          git config user.email "prices-bot@users.noreply.github.com"
          git add prices.json
          git commit -m "Update RUB and USD prices"
          git push
